<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚽ Football Quiz</title>
<style>
body{
  font-family:Arial;
  background:#111;
  color:white;
  display:flex;
  gap:20px;
  padding:20px;
}
#game,#scoreboard{
  background:#222;
  padding:20px;
  border-radius:10px;
}
#game{width:65%;}
#scoreboard{width:30%;}
button{
  padding:10px;
  margin:5px;
  min-width:220px;
  cursor:pointer;
  border:none;
  border-radius:5px;
}
.correct{background:#4CAF50;color:white;}
.wrong{background:#f44336;color:white;}
#timer{font-size:22px;color:#ff9800;}
.team-box{
  margin:5px 0;
  padding:5px 10px;
  border-radius:5px;
}
</style>
</head>
<body>

<div id="game">
<h1>⚽ Football Quiz</h1>

<label>Teams:</label>
<select id="teamCount">
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
</select>
<button id="start">Start</button>

<div id="teamSetup" style="display:none">
  <h3>Set team names and colors</h3>
  <div id="teamInputs"></div>
  <button id="begin">Begin Quiz</button>
</div>

<div id="qbox" style="display:none">
  <h3 id="turn"></h3>
  <p id="timer">⏱ 15</p>
  <h2 id="qtext"></h2>
  <div id="answers"></div>
</div>
</div>

<div id="scoreboard">
<h2>📊 Score</h2>
<div id="teams"></div>
<p>🏆 Win: 100 points</p>
</div>

<script>
let teams=0, teamData=[], current=0;
let time=15, interval, canAnswer=true;
let questions=[];

// ===== Words to identify football questions =====
const footballKeywords = ["football","soccer","goal","fifa","world cup","premier league","champions league","goalkeeper","striker","midfielder"];

// ===== Load Questions and filter football =====
async function loadQuestions(){
  const res = await fetch("https://opentdb.com/api.php?amount=50&category=21&type=multiple");
  const data = await res.json();
  // Filter questions for football
  questions = data.results.filter(q=>{
    const text = (q.question + " " + q.correct_answer + " " + q.incorrect_answers.join(" ")).toLowerCase();
    return footballKeywords.some(k => text.includes(k));
  });
  if(questions.length===0){
    alert("No football questions found! Try again.");
  }
}

// ===== HTML Elements =====
const startBtn=document.getElementById("start");
const teamCount=document.getElementById("teamCount");
const teamSetup=document.getElementById("teamSetup");
const teamInputs=document.getElementById("teamInputs");
const beginBtn=document.getElementById("begin");
const qbox=document.getElementById("qbox");
const qtext=document.getElementById("qtext");
const answersDiv=document.getElementById("answers");
const turn=document.getElementById("turn");
const timerEl=document.getElementById("timer");
const teamsDiv=document.getElementById("teams");

// ===== Start Setup =====
startBtn.onclick=()=>{
  teams = Number(teamCount.value);
  teamInputs.innerHTML = "";
  for(let i=0;i<teams;i++){
    teamInputs.innerHTML += `
      <div>
        Team ${i+1} Name: <input type="text" id="tname${i}" value="Team ${i+1}">
        Color: <input type="color" id="tcolor${i}" value="#${Math.floor(Math.random()*16777215).toString(16)}">
      </div>
    `;
  }
  teamSetup.style.display="block";
};

// ===== Begin Quiz =====
beginBtn.onclick=async()=>{
  await loadQuestions();
  if(questions.length===0) return;

  teamData = [];
  for(let i=0;i<teams;i++){
    const name = document.getElementById("tname"+i).value || `Team ${i+1}`;
    const color = document.getElementById("tcolor"+i).value;
    teamData.push({name,color,score:0});
  }

  // Display teams
  teamsDiv.innerHTML="";
  teamData.forEach((t,i)=>{
    teamsDiv.innerHTML += `<div class="team-box" id="s${i}" style="background:${t.color}">${t.name}: 0</div>`;
  });

  teamSetup.style.display="none";
  qbox.style.display="block";
  ask();
};

// ===== Ask Question =====
function ask(){
  if(questions.length===0){
    alert("No more questions!");
    location.reload();
    return;
  }

  clearInterval(interval);
  time=15;
  timerEl.textContent="⏱ "+time;

  interval=setInterval(()=>{
    time--;
    timerEl.textContent="⏱ "+time;
    if(time===0){
      clearInterval(interval);
      current=(current+1)%teams;
      ask();
    }
  },1000);

  canAnswer=true;
  const q=questions.pop();

  turn.textContent=`Turn: ${teamData[current].name}`;
  qtext.innerHTML=q.question;

  const answers=[q.correct_answer,...q.incorrect_answers].sort(()=>Math.random()-0.5);
  answersDiv.innerHTML="";
  answers.forEach(a=>{
    const b=document.createElement("button");
    b.innerHTML=a;
    b.onclick=()=>check(b,a,q.correct_answer);
    answersDiv.appendChild(b);
  });
}

// ===== Check Answer =====
function check(btn,a,correct){
  if(!canAnswer) return;
  canAnswer=false;
  clearInterval(interval);

  if(a===correct){
    btn.classList.add("correct");
    teamData[current].score +=5;
  }else{
    btn.classList.add("wrong");
    [...answersDiv.children].forEach(b=>{
      if(b.innerHTML===correct) b.classList.add("correct");
    });
  }

  document.getElementById("s"+current).textContent = `${teamData[current].name}: ${teamData[current].score}`;

  setTimeout(()=>{
    if(teamData.some(t=>t.score>=100)){
      const winner = teamData.find(t=>t.score>=100);
      alert(`🏆 ${winner.name} wins!`);
      location.reload();
      return;
    }
    current=(current+1)%teams;
    ask();
  },1200);
}
</script>
</body>
</html>
