<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ημέρες Κατάταξης</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://st3.depositphotos.com/5792148/15471/v/450/depositphotos_154711664-stock-illustration-cartoon-military-general-salute.jpg') no-repeat center center;
            background-size: cover;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            max-width: 90%;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
            max-width: 250px;
            border-radius: 5px;
            border: none;
        }
        button {
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Υπολογισμός Ημερών Κατάταξης</h1>
        <input type="date" id="enlistDate" placeholder="Εισάγετε ημερομηνία κατάταξης">
        <button onclick="calculateDays()">Υπολόγισε</button>
        <p id="result"></p>
    </div>

    <script>
        function calculateDays() {
            const input = document.getElementById('enlistDate').value;
            if (!input) {
                alert("Πρέπει να εισάγετε μια ημερομηνία!");
                return;
            }
            const enlistDate = new Date(input);
            const endDate = new Date(enlistDate);
            endDate.setDate(enlistDate.getDate() + 365);

            const today = new Date();
            const diffTime = endDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if(diffDays < 0){
                document.getElementById('result').textContent = "Η θητεία έχει ήδη ολοκληρωθεί!";
            } else {
                document.getElementById('result').textContent = `Απομένουν ${diffDays} μέρες για να συμπληρωθούν οι 365.`;
            }
        }
    </script>
</body>
</html>
