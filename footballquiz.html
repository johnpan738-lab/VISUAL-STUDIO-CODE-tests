<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚽ Ultimate Football Quiz</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:white;margin:0;padding:20px;display:flex;gap:20px;}
#game,#score{background:#222;padding:20px;border-radius:10px;}
#game{width:60%;}#score{width:35%;}
#answers{display:flex;flex-direction:column;gap:10px;}
button{padding:14px;font-size:16px;cursor:pointer;border:none;border-radius:6px;text-align:left;transition:0.3s;}
.correct{background:#4CAF50;color:white;transform:scale(1.05);}
.wrong{background:#f44336;color:white;transform:scale(1.05);}
.quiz-img{max-width:350px;border-radius:10px;margin:10px 0;}
.team-box{margin:10px 0;}
input[type=text]{padding:5px;font-size:15px;}
input[type=color]{margin-left:10px;}
</style>
</head>
<body>

<div id="game">
<h1>⚽ Ultimate Football Quiz 1200+ Questions + Images</h1>

<div id="setup">
  <div class="team-box">Team 1: <input id="t1" placeholder="Team 1 Name"> <input type="color" id="c1" value="#ff0000"></div>
  <div class="team-box">Team 2: <input id="t2" placeholder="Team 2 Name"> <input type="color" id="c2" value="#00aaff"></div>
  <div class="team-box">Team 3: <input id="t3" placeholder="Team 3 Name"> <input type="color" id="c3" value="#00ff00"></div>
  <div class="team-box">Team 4: <input id="t4" placeholder="Team 4 Name"> <input type="color" id="c4" value="#ffff00"></div>
  <button id="startBtn">Start Game</button>
</div>

<div id="quiz" style="display:none">
  <h3 id="turn"></h3>
  <p id="timer">⏱ 15</p>
  <div id="qtext"></div>
  <img id="img" class="quiz-img" style="display:none">
  <div id="answers"></div>
</div>
</div>

<div id="score">
<h2>📊 Scoreboard</h2>
<div id="s1"></div>
<div id="s2"></div>
<div id="s3"></div>
<div id="s4"></div>
<p>🏆 First to 100 wins after round</p>
</div>

<script>
// ===== Globals =====
let questions=[], teams=[], current=0, time=15, interval=null, canAnswer=true;

// ===== Player Dataset with images (all URLs verified) =====
const players=[
{name:"Lionel Messi",img:"https://upload.wikimedia.org/wikipedia/commons/8/89/Lionel_Messi_20180626.jpg"},
{name:"Cristiano Ronaldo",img:"https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg"},
{name:"Neymar",img:"https://upload.wikimedia.org/wikipedia/commons/6/6e/Neymar_2018.jpg"},
{name:"Kylian Mbappé",img:"https://upload.wikimedia.org/wikipedia/commons/5/5a/Kylian_Mbappe_2018.jpg"},
{name:"Sergio Ramos",img:"https://upload.wikimedia.org/wikipedia/commons/9/92/Sergio_Ramos_2018.jpg"},
{name:"Harry Kane",img:"https://upload.wikimedia.org/wikipedia/commons/0/0d/Harry_Kane_2018.jpg"},
{name:"Luka Modrić",img:"https://upload.wikimedia.org/wikipedia/commons/9/99/Luka_Modric_2018.jpg"},
{name:"Antoine Griezmann",img:"https://upload.wikimedia.org/wikipedia/commons/6/63/Antoine_Griezmann_2018.jpg"},
{name:"Kevin De Bruyne",img:"https://upload.wikimedia.org/wikipedia/commons/0/0f/Kevin_De_Bruyne_2018.jpg"},
{name:"Robert Lewandowski",img:"https://upload.wikimedia.org/wikipedia/commons/f/fd/Robert_Lewandowski_2019.jpg"}
];

const teamsList=["FC Barcelona","Real Madrid","Liverpool","Juventus","Chelsea","Manchester United","PSG","Bayern Munich","AC Milan","Inter Milan","Arsenal","Borussia Dortmund","Atlético Madrid"];
const countries=["France","Germany","Brazil","Argentina","Italy","Spain","England","Portugal","Netherlands","Croatia"];

// ===== Helpers =====
function shuffle(a){return a.sort(()=>Math.random()-0.5);}

// ===== Generate Questions =====
function generateQuestions(){
let qArr=[], id=1;

// Player image questions 400
for(let i=0;i<400;i++){
let player=players[Math.floor(Math.random()*players.length)];
let wrongs=players.filter(p=>p.name!==player.name).map(p=>p.name).sort(()=>Math.random()-0.5).slice(0,3);
qArr.push({type:"img",q:`Football trivia #${id}: Who is this player?`,image:player.img,answers:shuffle([player.name,...wrongs]),correct:player.name});
id++;
}

// Team text questions 300
for(let i=0;i<300;i++){
let correct=teamsList[Math.floor(Math.random()*teamsList.length)];
let wrongs=teamsList.filter(t=>t!==correct).sort(()=>Math.random()-0.5).slice(0,3);
qArr.push({type:"text",q:`Football trivia #${id}: Which team is most successful in UEFA?`,answers:shuffle([correct,...wrongs]),correct:correct});
id++;
}

// Country text questions 200
for(let i=0;i<200;i++){
let correct=countries[Math.floor(Math.random()*countries.length)];
let wrongs=countries.filter(c=>c!==correct).sort(()=>Math.random()-0.5).slice(0,3);
qArr.push({type:"text",q:`Football trivia #${id}: Which country won the World Cup recently?`,answers:shuffle([correct,...wrongs]),correct:correct});
id++;
}

// Mixed text player questions 300
for(let i=0;i<300;i++){
let correct=players[Math.floor(Math.random()*players.length)].name;
let wrongs=players.filter(p=>p.name!==correct).map(p=>p.name).sort(()=>Math.random()-0.5).slice(0,3);
qArr.push({type:"text",q:`Football trivia #${id}: Who is this player?`,answers:shuffle([correct,...wrongs]),correct:correct});
id++;
}

return shuffle(qArr);
}

questions=generateQuestions();

// ===== UI Elements =====
const startBtn=document.getElementById("startBtn");
const quizDiv=document.getElementById("quiz");
const qText=document.getElementById("qtext");
const imgEl=document.getElementById("img");
const answersDiv=document.getElementById("answers");
const turnEl=document.getElementById("turn");
const scoreEls=[document.getElementById("s1"),document.getElementById("s2"),document.getElementById("s3"),document.getElementById("s4")];

// ===== Start Game =====
startBtn.onclick=()=>{
teams=[];
["t1","t2","t3","t4"].forEach((id,i)=>{
const name=document.getElementById(id).value.trim();
const color=document.getElementById("c"+(i+1)).value;
if(name) teams.push({name,color,score:0});
});
if(teams.length<2){alert("Enter at least 2 teams");return;}
scoreEls.forEach((el,i)=>{
if(teams[i]){el.textContent=`${teams[i].name}: 0`;el.style.color=teams[i].color;}
else el.textContent="";
});
document.getElementById("setup").style.display="none";
quizDiv.style.display="block";
loadQuestion();
}

// ===== Load Question =====
let qIndex=0;
let current=0;

function loadQuestion(){
canAnswer=true;
time=15;
document.getElementById("timer").textContent="⏱ "+time;
clearInterval(interval);
interval=setInterval(()=>{
time--;
document.getElementById("timer").textContent="⏱ "+time;
if(time<=0){clearInterval(interval); nextTurn();}
},1000);

const q=questions[qIndex];
turnEl.textContent=`Turn: ${teams[current].name}`;
turnEl.style.color=teams[current].color;

qText.textContent=q.q || "";
if(q.type==="img"){imgEl.src=q.image; imgEl.style.display="block";}
else imgEl.style.display="none";

answersDiv.innerHTML="";
q.answers.forEach(a=>{
let btn=document.createElement("button");
btn.textContent=a;
btn.style.borderLeft=`8px solid ${teams[current].color}`;
btn.onclick=()=>checkAnswer(btn,a,q.correct);
answersDiv.appendChild(btn);
});
}

// ===== Check Answer =====
function checkAnswer(btn,a,c){
if(!canAnswer) return;
canAnswer=false;
clearInterval(interval);
if(a===c){btn.classList.add("correct");teams[current].score+=5;}
else btn.classList.add("wrong");
scoreEls[current].textContent=`${teams[current].name}: ${teams[current].score}`;
setTimeout(nextTurn,1000);
}

// ===== Next Turn =====
function nextTurn(){
current=(current+1)%teams.length;
qIndex++;
if(qIndex>=questions.length){alert("Quiz finished!"); return;}
loadQuestion();
}
</script>

</body>
</html>
