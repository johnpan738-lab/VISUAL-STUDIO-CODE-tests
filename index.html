<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ημέρες Στρατού</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: url('https://st3.depositphotos.com/5792148/15471/v/450/depositphotos_154711664-stock-illustration-cartoon-military-general-salute.jpg')
                  no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.85);
      padding: 25px;
      margin: 60px auto;
      max-width: 420px;
      border-radius: 12px;
      color: black;
    }

    h1 {
      margin-bottom: 8px;
    }

    .creator {
      font-size: 18px;
      font-weight: 900;      /* ΕΝΤΟΝΑ */
      color: #000000;        /* ΚΑΤΑΜΑΥΡΟ */
      margin-bottom: 25px;
    }

    input, button {
      padding: 10px;
      margin: 6px 0;
      width: 100%;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3e8e41;
    }

    #result {
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Ημέρες Στρατού</h1>
    <div class="creator">CREATED BY PANAGOPOULOS</div>

    <p>Πληκτρολόγησε την ημερομηνία κατάταξης σου:</p>

    <input type="date" id="enlistDate">
    <button onclick="calculateDays()">Υπολογισμός</button>

    <p id="result"></p>
  </div>

  <script>
    function calculateDays() {
      const input = document.getElementById('enlistDate').value;

      if (!input) {
        alert("Παρακαλώ διάλεξε ημερομηνία!");
        return;
      }

      const enlistDate = new Date(input);
      const endDate = new Date(enlistDate);
      endDate.setDate(enlistDate.getDate() + 365);

      const today = new Date();
      const diffTime = endDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const result = document.getElementById('result');

      if (diffDays > 0) {
        result.textContent = `Απομένουν ${diffDays} ημέρες μέχρι την απόλυση.`;
      } else if (diffDays === 0) {
        result.textContent = "Απολύεσαι ΣΗΜΕΡΑ! 🎉";
      } else {
        result.textContent = `Απολύθηκες πριν ${Math.abs(diffDays)} ημέρες.`;
      }
    }
  </script>

</body>
</html>
